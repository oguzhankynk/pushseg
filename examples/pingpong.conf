# Two processes on one machine. Run in two terminals:
#   ./pushseg_pingpong pingpong.conf 1 0 pong
#   ./pushseg_pingpong pingpong.conf 0 1 ping
# For two machines, change the addresses; nothing else changes.

[apps]
pingpong = 1

[node.0]
tcp = 127.0.0.1:40000

[node.1]
tcp = 127.0.0.1:41000

[links]
default = tcp

[backend.tcp]
connect_timeout_ms = 500
